[project]
name = "openpipeline"
dynamic = ["version"]
description = "Explain and review dbt projects: model graph, plain-English stories, PR summaries, and an MCP server for AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "OpenPipeline contributors" }]
keywords = ["dbt", "data-engineering", "lineage", "mcp", "data-catalog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "openpipeline-core==0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "mcp>=2.0,<3",
]

[project.scripts]
openpipeline = "openpipeline.cli:app"

[project.urls]
Homepage = "https://github.com/PawanPatil19/openpipeline"
Issues = "https://github.com/PawanPatil19/openpipeline/issues"

[project.optional-dependencies]
ai = [
    "anthropic>=2.3,<3",
]
preview = [
    "duckdb>=1.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/openpipeline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openpipeline"]
# The web UI is built into src/openpipeline/static before packaging (see Makefile).
artifacts = ["src/openpipeline/static/**"]

# The example project ships inside the package so `openpipeline demo` works after pip install.
# `uv build` makes the wheel from the sdist, and the sdist cannot see ../../examples, so the
# sdist copies the example into the package folder and the wheel picks it up from there.
# A wheel built straight from the repo falls back to examples/jaffle_shop (see demo.py).
[tool.hatch.build.targets.sdist.force-include]
"../../examples/jaffle_shop" = "src/openpipeline/_example"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.13'
        with:
          name: coverage
          path: coverage.xml

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: openpipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name op -p 8484:8484 openpipeline:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8484/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8484/api/project | grep -q '"model_count":5'
          curl -fsS http://127.0.0.1:8484/ | grep -q '<div id="root">'
          # The image listens on all interfaces, so it must not accept anonymous writes.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            -H 'Content-Type: application/json' -d '{"description":"x"}' \
            http://127.0.0.1:8484/api/models/customers/docs)
          test "$code" = 401
          curl -fsS http://127.0.0.1:8484/api/auth | grep -q '"writes":"token"'
          # The token printed in the logs is accepted.
          token=$(docker logs op 2>&1 | sed -n 's|.*[?]token=\([A-Za-z0-9_-]*\).*|\1|p' | head -n 1)
          test -n "$token"
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8484/api/auth \
            | grep -q '"token_valid":true'
      - if: failure()
        run: docker logs op

  pr-summary:
    name: PR summary action
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/pr-summary
        with:
          project-dir: examples/jaffle_shop
          comment: "false"

  all-green:
    # One required check for branch protection, so the matrix can change freely.
    name: All checks passed
    if: always()
    needs: [python, web, docker, pr-summary]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'

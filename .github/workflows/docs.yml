name: Site

# The website is deployed by Vercel's Git integration (see docs/releasing.md). This
# workflow builds the same site on pull requests, so a broken docs link (mkdocs
# --strict), demo export, or web demo build fails the check before Vercel sees it.

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "site/**"
      - "scripts/build_site.sh"
      - "scripts/export_demo.py"
      - "vercel.json"
      - "apps/web/**"
      - "apps/server/**"
      - "packages/core/**"
      - "examples/**"
      - "pyproject.toml"
      - "uv.lock"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: bash scripts/build_site.sh

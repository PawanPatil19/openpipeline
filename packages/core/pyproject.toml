[project]
name = "openpipeline-core"
dynamic = ["version"]
description = "Read a dbt project, build its model graph, and explain it in plain English."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "OpenPipeline contributors" }]
keywords = ["dbt", "data-engineering", "lineage", "sql"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
    "sqlglot>=30.0",
]

[project.urls]
Homepage = "https://github.com/PawanPatil19/openpipeline"
Issues = "https://github.com/PawanPatil19/openpipeline/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/openpipeline_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openpipeline_core"]
